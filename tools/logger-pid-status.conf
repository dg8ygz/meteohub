# Actual systemd main PID for the native Meteohub status page.
[Service]
ExecStartPost=/usr/bin/python3 -c 'import os,tempfile; p=int(os.environ["MAINPID"]); assert p>1; os.kill(p,0); f,n=tempfile.mkstemp(prefix=".loggerd-pid-",dir="/run"); os.write(f,(str(p)+chr(10)).encode()); os.close(f); os.replace(n,"/run/loggerd.pid")'
ExecStopPost=/usr/bin/rm -f -- /run/loggerd.pid
